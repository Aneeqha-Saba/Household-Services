<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <!-- Third party Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Register Professional</title>
</head>
<body style="background-color:rgb(195, 232, 255);">
    <div id="container">
        <div id="panel">
            <div id="input-form" style="width: 700px; height: 800px;">
            <form action="/professional_register" method="POST" enctype="multipart/form-data">
            <h2 style = "text-align: center;">Service Professional Signup</h2>
            <br><br>
            <div class = "mb-3">
                <label for="email">Email ID (Username):</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="mb-3">	
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="fullname">Fullname:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="mb-3">
                <label for="service_name">Service Name(Hourly Earnings):</label>
                <select id="service_name" name="service_name" required>
                    {% for service in services %}
                    <option value="{{ service.name }}">{{ service.name }} , Rs {{ service.price }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label for="specification">Specification:</label>
                <input type="text" id="specification" name="specification" required>
            </div>
            <div class="mb-3">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone" required>
            </div>
            <div class="mb-3">
                <label for="experience">Experience (in years):</label>
                <input type="number" id="experience" name="experience" min="0" required>
            </div>
            <div class="mb-3">
                <label for="document">Attach documents (single PDF):</label>
                <div class="file-upload">
                    <input type="file" id="document" name="documents" accept=".pdf" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="mb-3">
                <label for="pincode">Pin Code:</label>
                <input type="text" id="pincode" name="pincode" required>
            </div>
                <button class="btn btn-primary" type="submit">Register</button>
                
                <a href="/login">Login here</a> {{msg}}
            </form>
            </div>
        </div>
    </div>
</body>
</html>
