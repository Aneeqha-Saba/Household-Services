<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <!--third party bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Register Customer</title>
</head>
<body style="background-color:rgb(195, 232, 255);">
    <div id="container">
        <div id="panel">
            <div id="input-form" style="height: 500px;">
            <h2 style = "text-align: center;">Customer Signup</h2>
            <form action="/customer_register" method="POST">
            <br><br>
            <div class = "mb-3">	
                <label for="email">Email ID (Username):</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="mb-3">
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required>
            </div>
            <div class="mb-3">
                <label for="fullname">Fullname:</label>
                <input type="text" id="fullname" name="fullname" required>
            </div>
            <div class="mb-3">
                <label for="phone">Phone Number:</label>
                <input type="text" id="phone" name="phone"  required> 
            </div>
            <div class="mb-3">
                <label for="address">Address:</label>
                <input type="text" id="address" name="address" required>
            </div>
            <div class="mb-3">
                <label for="pincode">Pin Code:</label>
                <input type="text" id="pincode" name="pincode"  required>
            </div>
                <button type="submit" class="btn btn-primary">Register</button>
        
                <a href="/login">Login here</a> {{msg}}
            </form>
            </div>
        </div>
    </div>    
</body>
</html>
