<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/style.css">
    <!--third party bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>login page</title>
</head>
<body style="background-color:rgb(195, 232, 255);">
    <div id="container">
        <div id="panel">
            <nav class="navbar navbar-light bg-light">
                <div class="container-fluid">
                  <a class="navbar-brand">A-Z Household services</a>
                  <form class="d-flex">
                    <a href="/professional_register" class="btn btn-outline-success">Register as professional</a>
                  </form>
                </div>
            </nav>
            <div id="input-form" style="height: 400px;">
                <h2>Login</h2>
                <form action="/login" method="post">
                    <div class="mb-3">
                      <label for="email" class="form-label">Registered Email ID</label>
                      <input type="text" class="form-control" name="uname" id="email" aria-describedby="userHelp">
                      <div id="userHelp" class="form-text">We'll never share your email with anyone else.</div>
                    </div>
                    <div class="mb-3">
                      <label for="password" class="form-label">Password</label>
                      <input type="password" name="password" class="form-control" id="password">
                    </div>
                    <button type="submit" class="btn btn-primary">Login</button> <br> <br>
                    <a href="/customer_register" >Create Account?</a>
                    <br> {{msg}}
                  </form>
            </div>
        </div>
    </div>    
</body>
</html>
